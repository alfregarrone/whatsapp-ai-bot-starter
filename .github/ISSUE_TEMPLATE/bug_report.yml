name: Reportar un bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas que pasara y qué pasó en cambio.
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: El código más chico que muestre el problema.
      render: typescript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Node 20.11, Windows 11"
